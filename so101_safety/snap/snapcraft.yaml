name: so101-safety
base: core24
version: '0.1.0'
summary: SO-101 protective-stop enforcement
description: |
  Enforces the shared `/safety/protective_stop` (std_msgs/Bool) contract on
  the follower arm.
  Two mutually-exclusive enforcement
  strategies, selected with `mode`:

    mode=jtc (default): `trajectory_safety_gate` -- passes JointTrajectory
      messages through to the follower's trajectory controller while clear,
      and holds the last commanded pose while stopped. Pairs with the
      direct/split teleop path (`so101-teleop`'s `arm-mode=joint_trajectory`).

    mode=servo: `safety_pause_bridge` -- calls MoveIt Servo's pause_servo
      service on the follower to pause/resume. Pairs with the MoveIt Servo
      teleop path (not yet packaged as a snap).

  Runs as an always-on daemon. Configure via `snap set`:

      snap set so101-safety mode=jtc                      # jtc | servo
      snap set so101-safety safety-stop-topic=/safety/protective_stop

      # mode=jtc:
      snap set so101-safety gate-input-topic=/safety/follower/arm_trajectory_in
      snap set so101-safety gate-output-topic=/follower/arm_trajectory_controller/joint_trajectory
      snap set so101-safety joint-states-topic=/follower/joint_states

      # mode=servo:
      snap set so101-safety pause-service=/follower/servo_node/pause_servo

      snap set so101-safety ros-domain-id=0
      snap set so101-safety rmw-implementation=rmw_fastrtps_cpp

  `so101-teleop` auto-routes through this snap when present: it plugs the
  `safety-route` content interface this snap provides and, when connected,
  publishes its trajectory stream to the gate's `gate-input-topic` (read from
  the interface) instead of straight at the controller. 
  On store installs from the same publisher the
  interface auto-connects; a `--dangerous` local install needs a one-time:

      snap connect so101-teleop:safety-route so101-safety:safety-route

  If you change `gate-input-topic` after so101-teleop is already running,
  restart it (`snap restart so101-teleop`) so it re-reads the advertised topic.

  Check status with `snap services so101-safety` / `snap logs so101-safety`.

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    url: http://packages.ros.org/ros2/ubuntu
    suites: [noble]
    components: [main]
    key-id: C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654
    key-server: keyserver.ubuntu.com

apps:
  safety:
    extensions: [ros2-jazzy-ros-base]
    command: usr/bin/safety-launch
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    restart-delay: 5s
    plugs:
      - network
      - network-bind

# Content slot advertising this snap's presence AND its configured gate input
# topic to so101-teleop. so101-teleop plugs this and auto-routes its trajectory
# stream through the gate when connected -- no `snap set` needed. The shared
# dir carries $SNAP_COMMON/safety-route/route.env (SAFETY_JTC_TOPIC=<gate-input-topic>),
# written by the configure hook. Same-publisher content interfaces auto-connect
# on store installs; `--dangerous` installs need a manual `snap connect`.
slots:
  safety-route:
    interface: content
    content: so101-safety-route
    read:
      - $SNAP_COMMON/safety-route

hooks:
  # install: mkdir the shared slot dir before snapd sets up the content mount
  # (snapd does not auto-create $SNAP_COMMON content-slot source dirs).
  install: {}
  configure: {}

parts:
  safety:
    plugin: colcon
    source: .
    colcon-packages:
      - so101_safety

  launcher:
    plugin: dump
    source: snap/local
    organize:
      safety-launch: usr/bin/safety-launch
      # Fast DDS profile forcing UDP-only (no shared-memory transport), which
      # SHM can't do across strict-confinement sandboxes. Activated via
      # FASTRTPS_DEFAULT_PROFILES_FILE in safety-launch.
      fastdds_no_shared_memory.xml: usr/share/
    override-build: |
      craftctl default
      chmod +x "${CRAFT_PART_INSTALL}/safety-launch"
