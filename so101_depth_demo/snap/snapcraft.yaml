name: ai-vision-ros2
base: core22
version: '1.0.0-depth-nvidia'
summary: Depth Anything V2 depth visualisation, NVIDIA Jetson TensorRT (ROS 2 Humble)
description: |
  GPU monocular depth visualisation for the SO-101 arm, on an NVIDIA Jetson
  (Orin, JetPack 6.x). Subscribes to a ROS 2 image topic, runs Depth Anything
  V2 (Small) with ONNX Runtime's TensorRT execution provider, and republishes
  a colorised relative-depth image (for viewing, with the safety ROI/trigger
  overlaid), a raw normalised depth map (32FC1, for other machine consumers),
  and a std_msgs/Bool protective-stop signal computed directly by this node
  (ROI proximity + hysteresis debounce).

  This is the NVIDIA variant of the "ai-vision-ros2" snap, published on the
  latest/nvidia/* channels. It is the Jetson counterpart to the CPU variant on
  latest/stable (depth, so101_depth_demo) and latest/edge (YOLO person
  detection, so101_yolo_demo) -- same snap name, same `perception` service,
  same `snap set` keys, so the channel-swap story is preserved per
  architecture. The TensorRT engine is built and cached ON-DEVICE by ONNX
  Runtime on first run (no separate model snap / content interface).

  Runs as an always-on daemon. Configure with `snap set`, e.g.:

      snap set ai-vision-ros2 input-image-topic=/my/camera/image_raw
      snap set ai-vision-ros2 output-image-topic=/camera/depth/visualization
      snap set ai-vision-ros2 output-depth-topic=/perception/depth

  Requires JetPack 6.x on the target and the GPU interfaces connected (see
  docs/ai_vision_ros2_nvidia.md). Check status with
  `snap services ai-vision-ros2` / `snap logs ai-vision-ros2`.

grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: [arm64]
    build-for: [arm64]

# JetPack 6.x (L4T r36.x) userspace libraries. The snap gets its CUDA / cuDNN
# / TensorRT runtime from NVIDIA's repos (matching the on-device JetPack),
package-repositories:
  - type: apt
    components: [main]
    suites: [r36.5]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/t234
    architectures: [arm64]
  - type: apt
    components: [main]
    suites: [r36.5]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/common
    architectures: [arm64]


apps:
  perception:
    extensions: [ros2-humble-ros-base]
    command: usr/bin/depthanything-launch
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    restart-delay: 5s
    environment:
      LD_LIBRARY_PATH: "$SNAP/usr/lib/aarch64-linux-gnu/nvidia:/var/lib/snapd/lib/gl:/var/lib/snapd/lib/gl32:$SNAP/usr/local/cuda-12.6/targets/aarch64-linux/lib:$SNAP/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH"
      # Default TensorRT engine cache (overridable via engine-cache-dir).
      ORT_ENGINE_CACHE_DIR: $SNAP_COMMON/trt_engines
    plugs:
      - network
      - network-bind
      - hardware-observe
      - opengl
      - kernel-module-observe

hooks:
  configure: {}

parts:
  depth-demo:
    plugin: colcon
    source: .
    stage-packages:
      - libgomp1
      # opencv-python-headless (cv2) dlopen()s liblapack.so.3/libblas.so.3 at
      # runtime; the debs install those under usr/lib/<triplet>/lapack|blas/,
      # which isn't on the default search path -- exposed via LD_LIBRARY_PATH
      # in the launcher (same fix as the CPU variant).
      - liblapack3
      - libblas3
      # CUDA / cuDNN / TensorRT runtime for the TensorRT execution provider.
      # Versions track JetPack 6.x r36.5 (CUDA 12.6, cuDNN 9.3, TensorRT
      # 10.3); verified present in the JetPack repos above. tensorrt-libs is
      # the runtime meta-package pulling libnvinfer10 + plugin + onnx parser.
      - cuda-cudart-12-6
      - libcublas-12-6
      # cufft: dlopen'd by ORT's CUDA provider (linter-flagged missing dep of
      # libonnxruntime_providers_cuda.so).
      - libcufft-12-6
      # cudla: installs libcudla.so.1 into the CUDA target dir (already on
      # LD_LIBRARY_PATH); dlopen'd by ORT's TensorRT provider.
      - libcudla-12-6
      - libcudnn9-cuda-12
      - tensorrt-libs
      # NOTE: the Tegra driver shims (libcuda, libnvcudla, libnvdla_*, libnvrm_*,
      # libnvcucompat, libnvsciipc, ...) are staged separately by the gpu-driver
      # part below (from the PPA); only the CUDA/cuDNN/TensorRT compute libs are
      # staged here from NVIDIA's Jetson repos.
    build-packages:
      - python3-pip
    # colcon builds the ROS package; then install the Python inference
    # deps into the Debian dist-packages path.
    #onnxruntime comes from the Jetson AI Lab index (cp310 /
    # Python 3.10 / aarch64 / CUDA 12.6) -- the only prebuilt aarch64 ORT-gpu
    # wheels. core22's Python is 3.10, so this wheel is ABI-compatible.
    override-build: |
      craftctl default
      pip3 install \
        --ignore-installed \
        --no-compile \
        --target="${CRAFT_PART_INSTALL}/usr/lib/python3/dist-packages" \
        "numpy" \
        "opencv-python-headless"
      pip3 install \
        --ignore-installed \
        --no-compile \
        --target="${CRAFT_PART_INSTALL}/usr/lib/python3/dist-packages" \
        "https://pypi.jetson-ai-lab.io/jp6/cu126/+f/d98/0b934b9a29c1a/onnxruntime_gpu-1.24.0-cp310-cp310-linux_aarch64.whl#sha256=d980b934b9a29c1a9d6f39751edd7662b69fadd75556a10ff363773a58ce0950"

  # Model weights bundled directly into this snap.
  model:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      set -eux
      mkdir -p "${CRAFT_PART_INSTALL}/models"
      model="${CRAFT_PART_INSTALL}/models/depth_anything_v2_small.onnx"
      curl -fL --retry 5 --retry-delay 2 \
        "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx?download=true" \
        -o "${model}"
      test -s "${model}"
      size=$(stat -c%s "${model}")
      test "${size}" -gt 1000000 || { echo "Model too small (${size} bytes)" >&2; exit 1; }
      first=$(head -c 1 "${model}")
      test "${first}" != "<" || { echo "Downloaded an HTML error page, not the model" >&2; exit 1; }

  launcher:
    plugin: dump
    source: snap/local
    organize:
      depthanything-launch: usr/bin/depthanything-launch
      fastdds_no_shared_memory.xml: usr/share/

  # Prebuilt TensorRT engine cache shipped read-only and seeded into
  # $SNAP_COMMON/trt_engines on first run, so a matching device skips the engine
  # build. ORT rebuilds automatically if it doesn't match (GPU / TensorRT
  # version / model / precision). Regenerate ./prebuilt_engines/ when those
  # change.
  prebuilt-engine:
    plugin: dump
    source: prebuilt_engines
    organize:
      "*": prebuilt_engines/

  # Tegra driver shims from the ubuntu-tegra PPA, pinned to this device's kernel
  # nvgpu driver version. These MUST match the running kernel driver -- a skew
  # shows up at runtime as "chip Id=0" / NvRmGpuLibOpen failure, not a missing
  # library. Bump TEGRA_VER to match `dpkg-query -W nvidia-tegra-drivers-36-igpu-cuda`
  # if the device driver updates. Pruned to the shim allowlist (do NOT stage the
  # full driver: its compute-core libs would shadow opengl's host-injected copies).
  gpu-driver:
    plugin: nil
    stage-packages:
      - nvidia-l4t-core
      - nvidia-l4t-cuda
      - nvidia-l4t-dla-compiler
